<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Cace — AI Builder with Linguistic Acumen</title>
  <desc id="desc">米白、薄荷青与珊瑚色的编辑风格横幅，右侧是从意图到系统的节点图。</desc>
  <defs>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0V22" fill="none" stroke="#244c57" stroke-opacity=".12"/>
    </pattern>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b9e2da"/>
      <stop offset="1" stop-color="#f4f0e8"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="1196" height="376" rx="2" fill="#f4f0e8" stroke="#14262b" stroke-width="4"/>
  <rect x="28" y="28" width="1144" height="324" fill="none" stroke="#14262b" stroke-opacity=".2"/>
  <rect x="746" y="28" width="426" height="324" fill="url(#wash)"/>
  <rect x="746" y="28" width="426" height="324" fill="url(#grid)"/>
  <path d="M746 28V352" stroke="#14262b" stroke-width="3"/>

  <circle cx="66" cy="66" r="8" fill="#e9795f"/>
  <circle cx="66" cy="66" r="15" fill="none" stroke="#e9795f" stroke-opacity=".28" stroke-width="5"/>
  <text x="96" y="72" fill="#244c57" font-family="SFMono-Regular,Consolas,monospace" font-size="15" font-weight="700" letter-spacing="2">FIELD NOTES · LANGUAGE × AI × SYSTEMS</text>

  <text x="62" y="174" fill="#14262b" font-family="Iowan Old Style,Songti SC,Georgia,serif" font-size="92" font-weight="500" letter-spacing="-6">AI Builder</text>
  <text x="66" y="228" fill="#e9795f" font-family="Avenir Next,PingFang SC,Arial,sans-serif" font-size="38" font-weight="700" letter-spacing="-1.5">with Linguistic Acumen.</text>

  <path d="M66 272H682" stroke="#14262b"/>
  <text x="66" y="305" fill="#244c57" font-family="SFMono-Regular,Consolas,monospace" font-size="15" font-weight="700" letter-spacing="2">PARSE INTENT / MODEL CONTEXT / BUILD SYSTEMS</text>
  <text x="66" y="331" fill="#687578" font-family="Iowan Old Style,Songti SC,Georgia,serif" font-size="17">把复杂关系编译成可以理解、协作与运行的系统。</text>

  <g fill="none" stroke="#14262b" stroke-width="2">
    <path d="M959 78L852 155L813 244"/>
    <path d="M959 78V155L959 244"/>
    <path d="M959 78L1066 155L1105 244"/>
    <path d="M813 244L959 311"/>
    <path d="M959 244V311"/>
    <path d="M1105 244L959 311"/>
  </g>

  <g font-family="SFMono-Regular,Consolas,monospace" text-anchor="middle" font-weight="700">
    <circle cx="959" cy="78" r="33" fill="#fbf8f2" stroke="#14262b" stroke-width="2"/>
    <text x="959" y="83" fill="#14262b" font-size="12">INTENT</text>

    <rect x="800" y="132" width="104" height="46" rx="23" fill="#69c8bd" stroke="#14262b" stroke-width="2"/>
    <text x="852" y="160" fill="#14262b" font-size="11">SYNTAX</text>
    <rect x="907" y="132" width="104" height="46" rx="23" fill="#efb09e" stroke="#14262b" stroke-width="2"/>
    <text x="959" y="160" fill="#14262b" font-size="11">CONTEXT</text>
    <rect x="1014" y="132" width="104" height="46" rx="23" fill="#69c8bd" stroke="#14262b" stroke-width="2"/>
    <text x="1066" y="160" fill="#14262b" font-size="11">MODEL</text>

    <circle cx="813" cy="244" r="27" fill="#fbf8f2" stroke="#14262b" stroke-width="2"/>
    <text x="813" y="248" fill="#14262b" font-size="9">TOOLS</text>
    <circle cx="959" cy="244" r="27" fill="#fbf8f2" stroke="#14262b" stroke-width="2"/>
    <text x="959" y="248" fill="#14262b" font-size="9">EVAL</text>
    <circle cx="1105" cy="244" r="27" fill="#fbf8f2" stroke="#14262b" stroke-width="2"/>
    <text x="1105" y="248" fill="#14262b" font-size="9">LOOP</text>

    <rect x="877" y="287" width="164" height="48" fill="#14262b"/>
    <text x="959" y="316" fill="#fbf8f2" font-size="11">WORKING SYSTEM</text>
  </g>
